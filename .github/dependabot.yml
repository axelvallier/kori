version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    labels:
      - "type:chore"
    groups:
      # react et react-dom sont liés par une dépendance de pair : react-dom@X
      # exige react@^X. Bumpés séparément, chaque pull request casse
      # l'installation avec une erreur ERESOLVE, et les deux échouent. Ils
      # doivent bouger ensemble, avec leurs types.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Même raison : eslint-config-next est épinglé sur la version de next.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      # Troisième couple lié par une dépendance de pair : mcp-handler 2.x
      # exige @modelcontextprotocol/server ^2.0.0. Le connecteur est la seule
      # pièce du projet que Claude appelle de l'extérieur ; un des deux paquets
      # bumpé seul le casserait sans qu'aucun écran ne bouge.
      mcp:
        patterns:
          - "mcp-handler"
          - "@modelcontextprotocol/*"
      # Les mises à jour mineures et correctives des dépendances de
      # développement arrivent groupées : une pull request par semaine plutôt
      # qu'une par paquet.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Helsinki
    labels:
      - "type:chore"
