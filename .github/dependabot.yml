version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    labels:
      - "type:chore"
    # Les mises à jour mineures et correctives des dépendances de développement
    # arrivent groupées : une pull request par semaine plutôt qu'une par paquet.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Helsinki
    labels:
      - "type:chore"
